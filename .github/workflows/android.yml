name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle # reuse downloaded dependencies; fewer trips to Maven Central
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      # Sign with the project's release key (see docs/RELEASING.md). Pull requests and
      # forks don't get the secrets; they still build, signed with a throwaway debug key.
      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.LIBRE360_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::LIBRE360_KEYSTORE_B64 secret not set: building with a throwaway debug key. This APK will not be published as a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Lengths are printed (never contents) so a truncated copy-paste is easy to spot.
          echo "LIBRE360_KEYSTORE_B64 is ${#KEYSTORE_B64} characters long (a 4096-bit key is usually about 5,600)."
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12" 2>/dev/null; then
            echo "::error::LIBRE360_KEYSTORE_B64 is not valid base64. Re-copy the whole contents of libre360-release.b64 into the secret."
            exit 1
          fi
          echo "LIBRE360_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        if: steps.signing.outputs.signed == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.LIBRE360_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIBRE360_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::The LIBRE360_KEYSTORE_PASSWORD secret is missing or empty (check its exact name)."
            exit 1
          fi
          alias="${KEY_ALIAS:-libre360}"
          if ! out=$(keytool -list -keystore "$LIBRE360_KEYSTORE" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$alias" 2>&1); then
            case "$out" in
              *"password was incorrect"*)
                echo "::error::The key file is fine but LIBRE360_KEYSTORE_PASSWORD doesn't match it. Re-enter the password from when you created the key." ;;
              *"does not exist"*)
                echo "::error::The key file has no key named '$alias'. Set LIBRE360_KEY_ALIAS to the -alias you used." ;;
              *)
                echo "::error::Couldn't read the key file: it looks incomplete or damaged ($(stat -c %s "$LIBRE360_KEYSTORE") bytes after decoding). The LIBRE360_KEYSTORE_B64 secret is probably cut off; re-copy the WHOLE contents of libre360-release.b64 into it." ;;
            esac
            exit 1
          fi
          echo "Signing key OK (alias '$alias')."

      - name: Build
        env:
          LIBRE360_KEYSTORE_PASSWORD: ${{ secrets.LIBRE360_KEYSTORE_PASSWORD }}
          LIBRE360_KEY_ALIAS: ${{ secrets.LIBRE360_KEY_ALIAS }}
          LIBRE360_KEY_PASSWORD: ${{ secrets.LIBRE360_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintDebug

      - name: Show signing certificate
        id: cert
        run: |
          mv app/build/outputs/apk/release/app-release.apk libre360.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs libre360.apk | tee certs.txt
          sha=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: libre360-apk
          path: android/libre360.apk

      # Every build on main whose versionName has no release yet becomes a GitHub release
      # (e.g. v0.1.1) with the APK attached, but only when signed with the release key.
      # To ship a new release, bump versionName and versionCode in app/build.gradle.kts.
      - name: Publish release for new versions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.cert.outputs.sha256 }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          cat > notes.md <<NOTES
          Install \`libre360.apk\` on your Android phone. The server image is \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libre360:latest\`. See the README for setup.

          Signing certificate SHA-256 (every official Libre360 APK has this same fingerprint):
          \`$CERT_SHA256\`
          NOTES
          gh release create "$tag" libre360.apk --target "$GITHUB_SHA" --title "Libre360 $version" --notes-file notes.md
