name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      # Optional: sign with your own key so updates install over the previous version.
      # Add the repository secrets described in the README to enable this.
      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIBRE360_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LIBRE360_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LIBRE360_KEYSTORE_PASSWORD: ${{ secrets.LIBRE360_KEYSTORE_PASSWORD }}
          LIBRE360_KEY_ALIAS: ${{ secrets.LIBRE360_KEY_ALIAS }}
          LIBRE360_KEY_PASSWORD: ${{ secrets.LIBRE360_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintDebug

      - run: mv app/build/outputs/apk/release/app-release.apk libre360.apk
      - uses: actions/upload-artifact@v4
        with:
          name: libre360-apk
          path: android/libre360.apk

      # Every build on main whose versionName has no release yet becomes a GitHub release
      # (e.g. v0.1.0) with the APK attached. To ship a new release, bump versionName
      # (and versionCode) in app/build.gradle.kts.
      - name: Publish release for new versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" libre360.apk \
              --target "$GITHUB_SHA" \
              --title "Libre360 $version" \
              --notes "Install libre360.apk on your Android phone. The server image is ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libre360:latest. See the README for setup."
          fi
