name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "pebble/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "pebble/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle # reuse downloaded dependencies; fewer trips to Maven Central
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      # Sign with the project's release key (see docs/RELEASING.md). Pull requests and
      # forks don't get the secrets; they still build, signed with a throwaway debug key.
      - name: Set up signing key
        id: signing
        env:
          # The LIBRE360_* names are from before the project was renamed; either works.
          KEYSTORE_B64: ${{ secrets.THEREABOUTS_KEYSTORE_B64 || secrets.LIBRE360_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::THEREABOUTS_KEYSTORE_B64 secret not set: building with a throwaway debug key. This APK will not be published as a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Lengths are printed (never contents) so a truncated copy-paste is easy to spot.
          echo "THEREABOUTS_KEYSTORE_B64 is ${#KEYSTORE_B64} characters long (a 4096-bit key is usually about 5,600)."
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12" 2>/dev/null; then
            echo "::error::THEREABOUTS_KEYSTORE_B64 is not valid base64. Re-copy the whole contents of thereabouts-release.b64 into the secret."
            exit 1
          fi
          echo "THEREABOUTS_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        if: steps.signing.outputs.signed == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.THEREABOUTS_KEYSTORE_PASSWORD || secrets.LIBRE360_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THEREABOUTS_KEY_ALIAS || secrets.LIBRE360_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::The THEREABOUTS_KEYSTORE_PASSWORD secret is missing or empty (check its exact name)."
            exit 1
          fi
          # No alias secret needed: use the first key in the file (whatever -alias it was made with).
          alias="$KEY_ALIAS"
          if [ -z "$alias" ]; then
            alias=$(keytool -list -v -keystore "$THEREABOUTS_KEYSTORE" -storetype PKCS12 -storepass:env STORE_PASSWORD 2>/dev/null \
              | sed -n 's/^Alias name: //p' | head -1)
            alias="${alias:-thereabouts}"
          fi
          echo "THEREABOUTS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          if ! out=$(keytool -list -keystore "$THEREABOUTS_KEYSTORE" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$alias" 2>&1); then
            case "$out" in
              *"password was incorrect"*)
                echo "::error::The key file is fine but THEREABOUTS_KEYSTORE_PASSWORD doesn't match it. Re-enter the password from when you created the key." ;;
              *"does not exist"*)
                echo "::error::The key file has no key named '$alias'. Set the THEREABOUTS_KEY_ALIAS secret to the -alias you used, or delete it to auto-detect." ;;
              *)
                echo "::error::Couldn't read the key file: it looks incomplete or damaged ($(stat -c %s "$THEREABOUTS_KEYSTORE") bytes after decoding). The THEREABOUTS_KEYSTORE_B64 secret is probably cut off; re-copy the WHOLE contents of thereabouts-release.b64 into it." ;;
            esac
            exit 1
          fi
          echo "Signing key OK (alias '$alias')."

      - name: Build
        env:
          THEREABOUTS_KEYSTORE_PASSWORD: ${{ secrets.THEREABOUTS_KEYSTORE_PASSWORD || secrets.LIBRE360_KEYSTORE_PASSWORD }}
          THEREABOUTS_KEY_PASSWORD: ${{ secrets.THEREABOUTS_KEY_PASSWORD || secrets.LIBRE360_KEY_PASSWORD }}
          # THEREABOUTS_KEY_ALIAS comes from the "Check signing key" step.
        run: ./gradlew --no-daemon assembleRelease lintDebug

      - name: Show signing certificate
        id: cert
        run: |
          mv app/build/outputs/apk/release/app-release.apk thereabouts.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs thereabouts.apk | tee certs.txt
          sha=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: thereabouts-apk
          path: android/thereabouts.apk

      # Every build on main whose versionName has no release yet becomes a GitHub release
      # (e.g. v0.1.1) with the APK attached, but only when signed with the release key.
      # To ship a new release, bump versionName and versionCode in app/build.gradle.kts.
      - name: Publish release for new versions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ steps.cert.outputs.sha256 }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          cat > notes.md <<NOTES
          Install \`thereabouts.apk\` on your Android phone. The server image is \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thereabouts:latest\`. See the README for setup.

          Signing certificate SHA-256 (every official Thereabouts APK has this same fingerprint):
          \`$CERT_SHA256\`
          NOTES
          gh release create "$tag" thereabouts.apk --target "$GITHUB_SHA" --title "Thereabouts $version" --notes-file notes.md

  # The Pebble watchapp and watchface (.pbw files), attached to the same release.
  # Kept separate from the APK so a Pebble SDK hiccup never blocks a phone release.
  pebble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # pebble-tool doesn't support 3.14 yet
      - name: Install the Pebble SDK
        run: |
          python -m pip install --quiet pebble-tool uv # the SDK sets up its own venv with uv
          pebble sdk install latest
      - name: Build
        run: |
          (cd pebble/app && pebble build)
          (cd pebble/face && pebble build)
          cp pebble/app/build/app.pbw thereabouts-watch.pbw
          cp pebble/face/build/face.pbw thereabouts-face.pbw
      - uses: actions/upload-artifact@v4
        with:
          name: thereabouts-pebble
          path: "*.pbw"
      - name: Attach to the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" thereabouts-watch.pbw thereabouts-face.pbw --clobber
          else
            echo "No release v$version yet; the .pbw files are in the build artifacts."
          fi
