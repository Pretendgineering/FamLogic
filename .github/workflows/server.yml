name: Server

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./... && go test ./...
        working-directory: server

  image:
    # Publishes ghcr.io/<owner>/famlogic for amd64 and arm64 (e.g. Raspberry Pi 4/5),
    # with voice (whisper.cpp, Kokoro through sherpa-onnx, and their models) built in.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/famlogic
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Version label
        id: ver
        # e.g. "main-1a2b3c4" or "v0.8.0": shown in the dashboard and the app.
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "v=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.v }}
          # whisper.cpp takes a while to compile (ARM under emulation especially): reuse it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
