services:
  famlogic:
    # Use the published image, or comment this out and uncomment "build" to build it yourself.
    image: ghcr.io/pretendgineering/famlogic:latest
    # build: ./server
    container_name: famlogic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Password for the web console (where you invite people and choose modules). Required, 8+ characters.
      ADMIN_PASSWORD: "change-me-please"
      # Shown in the app and dashboard.
      FAMILY_NAME: "Our Family"
      # The address phones use to reach this server. Set it if invite links come out wrong
      # (for example behind some reverse proxies).
      # PUBLIC_URL: "https://family.example.com"
      # Map tiles. The default is the free OpenStreetMap server, which is fine for a family.
      # TILE_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      # TILE_ATTRIBUTION: "© OpenStreetMap contributors"
      # How long an invite link works, in hours.
      # INVITE_HOURS: "72"
      # Voice (talk to send messages, hear them read aloud) runs on this server, built in.
      # It uses about 400 MB of memory for a few seconds while someone talks. "off" switches it off.
      # VOICE: "off"
      # Your family's notes (lists, chores, meals, people…) are Markdown files in a "vault"
      # folder that Obsidian, Syncthing and AI agents can use too. By default it's inside the
      # data volume (/data/vault). To keep it in a folder on this computer instead, uncomment
      # the ./vault line under volumes, and set PUID/PGID to your user (run `id` to see them),
      # so the files are yours and other apps can edit them.
      # PUID: "1000"
      # PGID: "1000"
      # Or put the vault anywhere else inside the container (with its own volume):
      # VAULT_DIR: "/vault"
    volumes:
      - famlogic-data:/data
      # - ./vault:/data/vault

volumes:
  famlogic-data:
