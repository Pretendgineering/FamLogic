# CI runners have 16 GB: one Gradle JVM compiles Kotlin in-process with room to
# spare, two tasks at a time (four app variants at once ran out of memory).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
